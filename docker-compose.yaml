services:
  backend:
    container_name: compose-dist-backend
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_URL: "mongodb://mongoadmin:bgyuikmn@compose-dist-database:27017/distractible?authSource=admin"
    depends_on:
      - mongo

  frontend:
    container_name: compose-dist-frontend
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  mongo:
    image: mongo:4.4.6
    container_name: compose-dist-database
    volumes:
      - vol:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: bgyuikmn
#      MONGO_INITDB_ROOT_DATABASE: distractible

volumes:
  vol:

